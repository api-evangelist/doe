- aid: doe:doe-data-explorer-api
  name: DOE Data Explorer API
  description: >-
    The DOE Data Explorer API allows querying the Department of Energy's repository of research datasets
    resulting from DOE research funding. Built on REST architecture providing predictable URLs and HTTP-based
    access.
