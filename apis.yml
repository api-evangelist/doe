apis:
- aid: doe:nlr-electricity-apis
  name: NLR Electricity APIs
  description: >-
    NREL/NLR Developer Network electricity APIs covering utility rates, electricity costs, generation,
    transmission, delivery, and monitoring. Includes OpenEI Utility Rates API providing access to utility
    rate structures for most U.S. utilities. Sponsored by the U.S. Department of Energy.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.nlr.gov/docs/electricity/
  baseURL: https://developer.nlr.gov/api/
  tags:
  - Electricity
  - Utility Rates
  - Energy Costs
  properties:
  - type: Documentation
    url: https://developer.nlr.gov/docs/electricity/
  - type: Signup
    url: https://developer.nlr.gov/signup/
  contact:
  - FN: NLR Developer Network
    url: https://developer.nlr.gov/
